name: Waka Readme

on:
  workflow_dispatch:
  schedule:
    # Update setiap 2 jam
    - cron: "0 */2 * * *"

jobs:
  update-readme:
    name: Update Coding Statistics
    runs-on: ubuntu-latest

    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          TIME_RANGE: all_time
          BLOCKS: ⣀⣄⣤⣦⣶⣷⣿
          SHOW_TITLE: true
          SHOW_TIME: true
          SHOW_TOTAL: true
          LANG_COUNT: 10
